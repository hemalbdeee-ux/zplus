# zplus.ai on a Hostinger VPS (Docker Manager), next to RigConfigurator.
# Deploy: Docker Manager -> Compose -> "Compose from URL" with the raw URL of this file,
# or on the VPS: cd zplus && docker compose up -d --build
# Requires Traefik ("Deploy Traefik" in Docker Manager), like RigConfigurator.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zplus
    restart: unless-stopped
    environment:
      WBD_SITE_URL: https://${WBD_DOMAIN:-zplus.ai}
      WBD_ACCESS_CODE: ${WBD_ACCESS_CODE:-}
      WBD_WORKERS: ${WBD_WORKERS:-1}
      WBD_RETENTION_DAYS: ${WBD_RETENTION_DAYS:-7}
    volumes:
      - wbd-data:/data   # SQLite database and job files
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zplus.rule=Host(`${WBD_DOMAIN:-zplus.ai}`) || Host(`www.${WBD_DOMAIN:-zplus.ai}`)"
      - "traefik.http.routers.zplus.entrypoints=websecure"
      - "traefik.http.routers.zplus.tls.certresolver=letsencrypt"
      - "traefik.http.services.zplus.loadbalancer.server.port=8080"
      # www -> non-www
      - "traefik.http.middlewares.zplus-www.redirectregex.regex=^https://www\\.(.*)"
      - "traefik.http.middlewares.zplus-www.redirectregex.replacement=https://$${1}"
      - "traefik.http.middlewares.zplus-www.redirectregex.permanent=true"
      - "traefik.http.routers.zplus.middlewares=zplus-www"

volumes:
  wbd-data:
